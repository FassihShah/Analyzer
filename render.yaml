services:
  - type: web
    name: hirer-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # Neon: postgresql+psycopg://USER:PASS@HOST/DB?sslmode=require
        sync: false
      - key: REDIS_URL           # Upstash: rediss://default:PASS@HOST:6379
        sync: false
      - key: CORS_ORIGINS        # your deployed frontend URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
